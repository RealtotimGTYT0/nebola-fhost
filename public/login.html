<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · {name}</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script src="/app.js"></script></head>
<body><nav></nav><main class="fade">
<div class="auth-wrap card">
  <h2>Log in</h2><p class="muted">to <span data-site="name"></span></p>
  <form id="f">
    <label>Username</label><input name="username" autocomplete="username" required>
    <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" style="width:100%;margin-top:24px">Log in</button>
    <div class="msg" id="msg"></div>
  </form>
  <p class="muted" style="margin-top:12px;font-size:.9rem">No account? <a class="gradient-text" href="/register.html">Sign up</a></p>
</div>
</main><footer></footer>
<script>
const MODE = "login";
if (auth.token) location.href = "/dashboard.html";
if (MODE === "register") api("config").then(c => { if (!c.allowRegistration) { msg.className = "msg error"; msg.textContent = "Registration is currently disabled."; f.querySelector("button").disabled = true; } });
f.onsubmit = async (e) => {
  e.preventDefault(); const d = Object.fromEntries(new FormData(f)); msg.className = "msg";
  if (MODE === "register" && d.password !== d.confirm) { msg.className = "msg error"; msg.textContent = "Passwords don't match"; return; }
  try { const r = await api(MODE, { method: "POST", json: { username: d.username, password: d.password } }); auth.save(r.token, r.user); location.href = "/dashboard.html"; }
  catch (x) { msg.className = "msg error"; msg.textContent = x.message; }
};
</script></body></html>
