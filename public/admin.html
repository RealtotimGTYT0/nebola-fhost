<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · {name}</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script src="/app.js"></script></head>
<body><nav></nav><main class="fade">
<div id="denied" style="display:none" class="card auth-wrap"><h2>🚫 Access denied</h2><p class="muted">You need the <b id="need"></b> role to view this page.</p></div>
<div id="panel" style="display:none">
  <h1 style="font-size:2.4rem;letter-spacing:-.03em">Admin <span class="gradient-text">control</span></h1>
  <div class="stats">
    <div class="card stat"><div class="n" id="sU">0</div><div class="l">Users</div></div>
    <div class="card stat"><div class="n" id="sF">0</div><div class="l">Files</div></div>
    <div class="card stat"><div class="n" id="sS">0</div><div class="l">Storage used</div></div>
  </div>
  <div class="tabs"><button class="btn sm active" data-t="users">Users</button><button class="btn sm" data-t="files">Files</button></div>
  <div class="card" style="overflow-x:auto"><table id="tbl"></table></div>
  <p class="muted" style="margin-top:14px;font-size:.85rem">Tip: roles set in <code>user.json</code> override roles chosen here.</p>
</div>
</main><footer></footer>
<script>
requireLogin();
let data, cfg, tab = "users";
async function init() {
  cfg = await api("config"); need.textContent = cfg.adminPageRole;
  try { data = await api("admin/overview"); } catch { denied.style.display = "block"; return; }
  panel.style.display = "block"; render();
}
function render() {
  sU.textContent = data.users.length; sF.textContent = data.files.length; sS.textContent = fmtSize(data.totalSize);
  const roles = Object.keys(cfg.roles);
  if (tab === "users") tbl.innerHTML = `<tr><th>User</th><th>Role</th><th>Files</th><th>Joined</th><th>Actions</th></tr>` + data.users.map(u => `
    <tr><td><b>${esc(u.username)}</b> ${u.banned ? '<span class="badge" style="color:var(--danger)">banned</span>' : ""}</td>
    <td>${roleBadge(u.role)} <select class="inline" onchange="setRole('${u.username}', this.value)">${roles.map(r => `<option ${r === u.role ? "selected" : ""}>${r}</option>`).join("")}</select></td>
    <td>${data.files.filter(f => f.owner === u.username).length}</td><td class="muted">${new Date(u.created).toLocaleDateString()}</td>
    <td class="row"><button class="btn sm" onclick="ban('${u.username}', ${!u.banned})">${u.banned ? "Unban" : "Ban"}</button><button class="btn sm danger" onclick="delUser('${u.username}')">Delete</button></td></tr>`).join("");
  else tbl.innerHTML = `<tr><th>File</th><th>Owner</th><th>Size</th><th>Uploaded</th><th>Actions</th></tr>` + data.files.map(f => `
    <tr><td><a href="/f/${f.id}" target="_blank">${esc(f.name)}</a></td><td>${esc(f.owner)}</td><td>${fmtSize(f.size)}</td><td class="muted">${new Date(f.created).toLocaleString()}</td>
    <td><button class="btn sm danger" onclick="delFile('${f.id}')">Delete</button></td></tr>`).join("");
}
document.querySelectorAll(".tabs .btn").forEach(b => b.onclick = () => { document.querySelectorAll(".tabs .btn").forEach(x => x.classList.remove("active")); b.classList.add("active"); tab = b.dataset.t; render(); });
const refresh = async () => { data = await api("admin/overview"); render(); };
async function setRole(u, role) { const r = await api("admin/users/" + u, { method: "PATCH", json: { role } }); toast(r.note || "Role updated"); refresh(); }
async function ban(u, banned) { await api("admin/users/" + u, { method: "PATCH", json: { banned } }); toast(banned ? "Banned" : "Unbanned"); refresh(); }
async function delUser(u) { if (confirm("Delete user " + u + "?")) { await api("admin/users/" + u, { method: "DELETE" }); toast("User deleted"); refresh(); } }
async function delFile(id) { if (confirm("Delete file?")) { await api("files/" + id, { method: "DELETE" }); toast("File deleted"); refresh(); } }
init();
</script></body></html>
