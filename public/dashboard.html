<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · {name}</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script src="/app.js"></script></head>
<body><nav></nav><main class="fade">
<h1 style="font-size:2.4rem;letter-spacing:-.03em">Your files</h1>
<p class="muted" id="limits"></p>
<div class="card drop" id="drop" style="margin-top:20px">
  <div class="big">⬆</div><p><b>Drop files here</b> or click to browse</p>
  <input type="file" id="pick" multiple hidden>
  <div class="progress" id="prog"><div></div></div>
</div>
<div class="files" id="list"></div>
</main><footer></footer>
<script>
requireLogin();
const isImg = (t) => t && t.startsWith("image/");
async function load() {
  const me = await api("me");
  limits.innerHTML = `Signed in as <b>${esc(me.user.username)}</b> ${roleBadge(me.user.role)} · up to ${me.limits.maxFileSizeMB} MB per file · ${me.limits.maxFiles} files`;
  const { files } = await api("files");
  list.innerHTML = files.length ? files.map(f => `
    <div class="card file fade">
      <div class="thumb">${SITE.features.showImagePreviews && isImg(f.type) ? `<img src="/f/${f.id}" loading="lazy">` : "📄"}</div>
      <div class="name" title="${esc(f.name)}">${esc(f.name)}</div>
      <div class="muted" style="font-size:.8rem">${fmtSize(f.size)} · ${new Date(f.created).toLocaleDateString()}</div>
      <div class="row">
        <button class="btn sm" onclick="copy('${f.id}')">Copy link</button>
        <a class="btn sm" href="/f/${f.id}" target="_blank">Open</a>
        <button class="btn sm danger" onclick="del('${f.id}')">Delete</button>
      </div>
    </div>`).join("") : `<p class="muted">No files yet.</p>`;
}
function copy(id) { navigator.clipboard.writeText(location.origin + "/f/" + id); toast("Link copied"); }
async function del(id) { if (!confirm("Delete this file?")) return; try { await api("files/" + id, { method: "DELETE" }); toast("Deleted"); load(); } catch (e) { toast(e.message); } }
function upload(file) {
  return new Promise((res) => {
    const x = new XMLHttpRequest(); const fd = new FormData(); fd.append("file", file);
    prog.style.display = "block";
    x.upload.onprogress = (e) => (prog.firstElementChild.style.width = (e.loaded / e.total) * 100 + "%");
    x.onload = () => { const d = JSON.parse(x.responseText || "{}");
      if (x.status === 200) { if (SITE.features.copyLinkOnUpload) navigator.clipboard?.writeText(d.url).catch(()=>{}); toast(SITE.features.copyLinkOnUpload ? "Uploaded · link copied" : "Uploaded"); }
      else toast(d.error || "Upload failed"); res(); };
    x.onerror = () => { toast("Upload failed"); res(); };
    x.open("POST", "/api/upload"); x.setRequestHeader("authorization", "Bearer " + auth.token); x.send(fd);
  });
}
async function handle(files) { for (const f of files) await upload(f); prog.style.display = "none"; prog.firstElementChild.style.width = 0; load(); }
drop.onclick = () => pick.click();
pick.onchange = () => handle(pick.files);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); handle(e.dataTransfer.files); };
load().catch(e => toast(e.message));
</script></body></html>
