<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · {name}</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script src="/app.js"></script></head>
<body><nav></nav><main class="fade">
<h1 class="hero"><span data-site="name"></span><br><span class="gradient-text">file hosting.</span></h1>
<p class="lead" data-site="tagline"></p>
<div class="row" style="margin-top:28px">
  <a class="btn primary" href="/dashboard.html">Start uploading →</a>
  <a class="btn" href="/register.html" id="cta2">Create account</a>
</div>
<div class="stats" id="perks">
  <div class="card stat"><div class="n">⚡</div><div class="l">Instant shareable links</div></div>
  <div class="card stat"><div class="n">🔐</div><div class="l">Accounts with roles</div></div>
  <div class="card stat"><div class="n" id="maxsize">–</div><div class="l">Max upload per file</div></div>
</div>
</main><footer></footer>
<script>
if (auth.user) document.getElementById("cta2").style.display = "none";
if (!SITE.features.showLandingStats) document.getElementById("perks").remove();
api("config").then(c => { const m = Math.max(...Object.values(c.roles).map(r => r.maxFileSizeMB)); document.getElementById("maxsize").textContent = m + " MB"; }).catch(()=>{});
</script></body></html>
